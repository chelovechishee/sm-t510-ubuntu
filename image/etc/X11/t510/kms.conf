# SM-T510: KMS (exynos7885-decon) + glamor on the Mali GPU (Panfrost)
# Written by t510-rotate (portrait)
Section "Device"
	Identifier "t510-kms"
	Driver "modesetting"
	Option "kmsdev" "/dev/dri/by-path/platform-14860000.display-controller-card"
	Option "AccelMethod" "glamor"
	Option "Monitor-DSI-1" "t510-panel"
EndSection

Section "Monitor"
	Identifier "t510-panel"
	Option "Rotate" "normal"
EndSection

# Blanking: xfce4-power-manager drives DPMS "off" (KMS: CRTC off, backlight
# off); only the off timeout is used. The render-only GPU (Panfrost) is not
# a separate X screen.
Section "ServerFlags"
	Option "BlankTime" "0"
	Option "AutoAddGPU" "false"
EndSection
