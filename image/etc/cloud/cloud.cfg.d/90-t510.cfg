# SM-T510: cloud-init only applies what the installer wrote to
# /var/lib/cloud/seed/nocloud (user, password, ssh key, Wi-Fi, time zone).
# Without a seed ds-identify finds no data source and cloud-init stays off.
datasource_list: [ NoCloud ]
# NetworkManager configures the network (a Wi-Fi keyfile comes as write_files)
network:
  config: disabled
# resize-rootfs.service grows the root file system (t510-resize-rootfs);
# cloud-init's resize runs resize2fs, which this kernel refuses on a mounted
# device ("Device or resource busy")
resize_rootfs: false
growpart:
  mode: "off"
