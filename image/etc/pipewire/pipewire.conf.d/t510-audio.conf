# SM-T510: ABOX PCMs are not auto-probed (the DSP firmware crashes on odd
# formats, see /etc/wireplumber/wireplumber.conf.d/51-t510.conf). One fixed-format sink
# on RDMA0; t510-audio.service routes it to the speakers or the headphones.
# Channel order written by t510-rotate (portrait).
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.sink
            node.name              = "t510-output"
            node.description       = "Built-in Audio"
            media.class            = "Audio/Sink"
            api.alsa.path          = "hw:0,0"
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            api.alsa.period-size   = 1024
            api.alsa.headroom      = 1024
            priority.session       = 1000
            priority.driver        = 1000
        }
        # keep PipeWire running when ABOX is off (snd_soc_abox.enable=0)
        flags = [ nofail ]
    }
]
