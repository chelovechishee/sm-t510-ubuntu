# The user manager runs at OOMScoreAdjust=100 and gives its services 200, while
# apps started from the XFCE session (lightdm scope) run at 0. With RAM + zram
# that bonus outweighs ~800 MB, and GPU buffers barely show in an app's RSS, so
# a game running out of memory got dbus, pipewire and the portals killed first.
# Run the manager at -100: its services then default to 0 like the apps, and
# the session plumbing (user/50-t510-oom.conf drop-ins) may stay at -100.
[Service]
OOMScoreAdjust=-100
