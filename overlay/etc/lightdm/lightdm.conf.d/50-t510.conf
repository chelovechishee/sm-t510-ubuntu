[Seat:*]
# Password login (no autologin); the user list is shown so only the password
# has to be typed, with the on-screen keyboard from the accessibility menu
greeter-hide-users=false
user-session=xfce
greeter-session=t510-gtk-greeter
# KMS + glamor on the GPU with the exynos7885-decon driver, fbdev without it
xserver-command=/usr/sbin/t510-xorg -core
display-setup-script=/usr/sbin/t510-display-setup
session-setup-script=/usr/sbin/t510-display-setup
