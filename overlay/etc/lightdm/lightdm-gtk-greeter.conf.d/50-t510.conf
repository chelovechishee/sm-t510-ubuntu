# SM-T510 login screen: on-screen keyboard (Onboard, embedded) from the
# accessibility indicator; not shown until asked for
[greeter]
keyboard=onboard --xid
# full width, bottom third of the portrait screen (default: half width, 25%)
keyboard-position=50%,center -0;100% 30%
a11y-states=
indicators=~host;~spacer;~clock;~spacer;~a11y;~power
# the greeter runs with GDK_SCALE=2 (t510-gtk-greeter.desktop): 96 dpi and a
# 24 px cursor at 2x match the Xfce session (xsettings DPI 160, cursor 48)
xft-dpi=96
cursor-theme-size=24
