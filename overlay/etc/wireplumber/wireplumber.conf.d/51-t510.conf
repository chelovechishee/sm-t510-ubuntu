# SM-T510.
# The ABOX audio DSP firmware crashes when PCMs are probed with arbitrary
# formats (8ch/32bit), so the card is not auto-probed; PipeWire gets
# fixed-format nodes from /etc/pipewire/pipewire.conf.d/t510-audio*.conf.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
      { device.name = "~alsa_card.platform-samsung-abox-dump*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# Cameras come through libcamera (its software ISP turns the raw Bayer of
# the CSIS into pictures); the V4L2 monitor would offer the same raw nodes
# as cameras of their own, so it stays off. USB webcams go through
# libcamera too (its uvcvideo pipeline).
wireplumber.profiles = {
  main = {
    monitor.v4l2 = disabled
  }
}
