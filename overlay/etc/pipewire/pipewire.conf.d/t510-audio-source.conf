# SM-T510 capture: COD3035 ADC via ABOX WDMA1 (Android capture_link 9).
# t510-audio.service picks the built-in (MIC1) or the headset mic (MIC3).
context.objects = [
    {   factory = adapter
        args = {
            factory.name           = api.alsa.pcm.source
            node.name              = "t510-input"
            node.description       = "Built-in Microphone"
            media.class            = "Audio/Source"
            api.alsa.path          = "hw:0,9"
            audio.format           = "S16LE"
            audio.rate             = 48000
            audio.channels         = 2
            audio.position         = [ FL FR ]
            api.alsa.period-size   = 1024
            api.alsa.headroom      = 1024
            priority.session       = 1000
            priority.driver        = 1000
        }
        # keep PipeWire running when ABOX is off (snd_soc_abox.enable=0)
        flags = [ nofail ]
    }
]
