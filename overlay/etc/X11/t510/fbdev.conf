# SM-T510 fallback: Samsung decon framebuffer, plain fbdev with shadow fb
# Written by t510-rotate (portrait)
Section "Device"
	Identifier "decon"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "on"
EndSection

# Blanking: xfce4-power-manager drives DPMS "off" (KMS: CRTC off, backlight
# off); only the off timeout is used. The render-only GPU (Panfrost) is not
# a separate X screen.
Section "ServerFlags"
	Option "BlankTime" "0"
	Option "AutoAddGPU" "false"
EndSection
