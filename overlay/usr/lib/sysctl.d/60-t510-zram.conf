# Swap goes to zram (compressed RAM), not to flash: swapping out anonymous
# memory is cheaper than reading dropped file cache back from the eMMC, so
# prefer it (100 is even, 200 the most; 180 as other zram setups use), and
# swap single pages, since readahead does not help a RAM device
vm.swappiness = 180
vm.page-cluster = 0
# no extra reclaim after a fragmentation event (watermark boost): with zram
# it only pushes pages to swap that are needed again soon
vm.watermark_boost_factor = 0
